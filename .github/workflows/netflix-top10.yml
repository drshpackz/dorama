# Netflix Top 10 -> netflix/*.json for netflix.js (tools/netflix/README.md).
# Weekly: download the Netflix files, build only when Netflix published a new week,
# commit only when the files changed. Bad input fails the job before anything is
# written, so the published files stay as they were and GitHub sends a mail.
name: Netflix Top 10 data
on:
  schedule:
    - cron: '0 21 * * 2'   # вторник: Netflix выкладывает неделю около 19:55 UTC
    - cron: '0 7 * * 3'    # среда: повтор, если во вторник новой недели ещё не было
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Сопоставить с TMDB все ещё не сопоставленные тайтлы (глобальные первыми)'
        type: boolean
        default: false
      tmdb_budget:
        description: 'Запросов к TMDB за запуск, 0 — без предела'
        type: string
        default: '600'
      force:
        description: 'Собрать, даже если неделя та же (после правки overrides.json)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: netflix-top10
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36'
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      BACKFILL: ${{ inputs.backfill && 'yes' || '' }}
      FORCE: ${{ inputs.force && 'yes' || '' }}
      BUDGET: ${{ inputs.tmdb_budget || '600' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the Netflix files
        run: |
          bash tools/netflix/fetch.sh .nf
          python3 tools/netflix/fetch_www.py --sources tools/netflix/www-sources.json --dest .nf

      - name: New week?
        id: week
        run: |
          new=$(cut -f1 .nf/all-weeks-global.tsv | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -n 1)
          old=$(python3 -c 'import json; print(json.load(open("netflix/manifest.json"))["v"])' 2>/dev/null || echo none)
          echo "Netflix: $new, published here: $old"
          if [ "$new" = "$old" ] && [ -z "$BACKFILL" ] && [ -z "$FORCE" ]; then
            echo 'нет новой недели'
            echo 'build=no' >> "$GITHUB_OUTPUT"
          else
            echo 'build=yes' >> "$GITHUB_OUTPUT"
          fi

      - name: Build netflix/*.json
        if: steps.week.outputs.build == 'yes'
        run: |
          set -- --src .nf --state tools/netflix/state --overrides tools/netflix/overrides.json --out netflix --tmdb-budget "$BUDGET"
          if [ -n "$BACKFILL" ]; then set -- "$@" --backfill; fi
          if [ -z "$TMDB_API_KEY" ]; then set -- "$@" --no-tmdb; fi
          python3 tools/netflix/pipeline.py "$@"

      - name: Commit
        if: steps.week.outputs.build == 'yes'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add netflix tools/netflix/state
          if git diff --cached --quiet; then echo 'нечего коммитить'; exit 0; fi
          git commit -m "netflix: неделя $(python3 -c 'import json; print(json.load(open("netflix/manifest.json"))["v"])')"
          git pull --rebase && git push
