<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Топ-10 · трейлер</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; }
    /* Покрывало над плеером (trailers-10). YouTube при каждом пуске, перемотке и продолжении сам рисует на ~4 с
       строку названия сверху (52 px), ⏸ в центре (круг 56 px), «Поделиться» слева внизу (круг 40 px в 38 px от
       левого края и 16 px от нижнего) и «Другие видео» с логотипом справа внизу (328×48 px в 30 px от правого края
       и 12 px от нижнего, надпись — с 12 px от его левого края); controls=0 и другие playerVars их не убирают.
       Размеры и отступы у YouTube в пикселях при любом размере плеера (замер 12.11.2026: 960×540, 1280×720,
       1920×1080), поэтому закрываем ровно эти места и не шире: субтитры рядом остаются видны, под покрывало уходит
       только то, что закрывал сам YouTube. Значки в кругах — матовым стеклом (размытие), а не чёрным диском,
       который виден на светлом кадре; без backdrop-filter (старые ТВ) — тёмным пятном размером со значок. full —
       чёрный кадр до первой картинки ролика, потом плавное появление. */
    #veil { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; background-color: rgba(0,0,0,0);
      -webkit-transition: opacity .5s, background-color .3s; transition: opacity .5s, background-color .3s; }
    #veil.on { opacity: 1; -webkit-transition: background-color .3s; transition: background-color .3s; }
    #veil.full { background-color: #000; }
    #veil i { position: absolute; display: block; }
    #veil .vt { left: 0; right: 0; top: 0; height: 72px;
      background: -webkit-linear-gradient(top, #000 72%, rgba(0,0,0,0) 100%); background: linear-gradient(to bottom, #000 72%, rgba(0,0,0,0) 100%); }
    #veil .vm, #veil .vl { border-radius: 50%; }
    #veil .vm { left: 50%; top: 50%; width: 168px; height: 168px; margin: -84px 0 0 -84px;
      background: -webkit-radial-gradient(50% 50%, closest-side, rgba(0,0,0,.85) 24%, rgba(0,0,0,0) 40%);
      background: radial-gradient(closest-side at 50% 50%, rgba(0,0,0,.85) 24%, rgba(0,0,0,0) 40%); }
    #veil .vl { left: 10px; bottom: -12px; width: 96px; height: 96px;
      background: -webkit-radial-gradient(50% 50%, closest-side, rgba(0,0,0,.85) 29%, rgba(0,0,0,0) 50%);
      background: radial-gradient(closest-side at 50% 50%, rgba(0,0,0,.85) 29%, rgba(0,0,0,0) 50%); }
    #veil .vr { right: 30px; bottom: 12px; width: 320px; height: 48px; border-radius: 12px; background: #000;
      -webkit-box-shadow: 0 0 6px 2px #000; box-shadow: 0 0 6px 2px #000; }
    /* Матовое стекло втрое шире значка с размытым краем: белый значок и тёмный круг YouTube расходятся по нему
       слабой дымкой, а не лежат тёмным диском (у узкого стекла дымка от белого значка видна на тёмном кадре). */
    @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      #veil .vm, #veil .vl { background: none;
        -webkit-mask-image: -webkit-radial-gradient(50% 50%, closest-side, #000 40%, rgba(0,0,0,0) 100%);
        -webkit-mask-image: radial-gradient(closest-side at 50% 50%, #000 40%, rgba(0,0,0,0) 100%);
        mask-image: radial-gradient(closest-side at 50% 50%, #000 40%, rgba(0,0,0,0) 100%); }
      #veil .vm { -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
      #veil .vl { -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    }
    /* Уведомление YouTube о субтитрах («Английский (Соединённые Штаты)», «Для настройки нажмите на значок ⚙») —
       окно субтитров сверху: в первые ~2 с ролика и после смены дорожки, концом под подписью плагина. Его место
       растёт с плеером (низ — 20 % высоты и ещё 19–33 px), поэтому полоса — в долях. */
    #capv { position: absolute; left: 0; right: 0; top: 0; height: 20%; height: -webkit-calc(20% + 34px); height: calc(20% + 34px);
      background: #000; pointer-events: none; opacity: 0; -webkit-transition: opacity .5s; transition: opacity .5s; }
    #capv:after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 24px;
      background: -webkit-linear-gradient(top, #000, rgba(0,0,0,0)); background: linear-gradient(to bottom, #000, rgba(0,0,0,0)); }
    #capv.on { opacity: 1; -webkit-transition: none; transition: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="veil" class="on full"><i class="vt"></i><i class="vm"></i><i class="vl"></i><i class="vr"></i></div>
  <div id="capv"></div>
  <script>
  (function () {
    'use strict';

    // Мост трейлеров netflix.js (спека §8.4). Своя копия идеи youtube.html Lampa: тот мост не передаёт
    // YouTube cc_load_policy, cc_lang_pref и hl, а без них русские субтитры сами не включаются.
    // Адрес: netflix-trailer.html?id=<bridgeId>&list=<пункты>&i=<с какого начать>[&nocc=<ключи>][&hold=1].
    // list — пункты через запятую, пункт — ключи YouTube через «~» в порядке попытки: RU, при ошибке — EN.
    // nocc — ключи с русским звуком через запятую: субтитры YouTube им не навязываются и не проверяются.
    // hold=1 — каждый пункт только загружается (cue) и ждёт команды play: плагин сначала показывает карточку.
    // Сообщения родителю: {nf:id, ev:'bridge'|'ready'|'item'|'state'|'captions'|'ad'|'error'|'end', …}.
    // Команды от родителя: {nf:id, cmd:'toggle'|'play'|'pause'|'next'|'prev'|'alt'|'destroy'}, {nf:id, cmd:'seek', by:±10}.

    var KEY = /^[A-Za-z0-9_-]{11}$/;
    var NEXT_AFTER_FATAL = 1500;   // мс до следующего пункта после ролика, который не играет никаким ключом
    var CAP_WAIT = 1500;           // мс после начала игры до проверки субтитров
    var CAP_TRIES = 6;             // повторы раз в секунду, пока у плеера нет списка дорожек
    var AD_POLL = 1000;            // мс между проверками рекламы YouTube
    var VEIL_HOLD = 4500;          // мс игры под покрывалом: свои кнопки YouTube гаснут к 4,1 с после state 1
    var VEIL_FULL = 6000;          // мс чёрного кадра без игры: дольше — пусть видно, что показывает YouTube
    var VEIL_CAP = 3000;           // мс полосы над уведомлением о субтитрах: YouTube держит его ~2 с

    function param(name) {
      var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search || '');
      if (!m) return '';
      try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return m[1]; }
    }
    // Пустой пункт остаётся на своём месте: номера пунктов у моста и у плагина совпадают.
    function parseList(s) {
      var out = [], parts = String(s || '').split(','), i, j, keys, k;
      for (i = 0; i < parts.length; i++) {
        keys = []; k = parts[i].split('~');
        for (j = 0; j < k.length; j++) if (KEY.test(k[j])) keys.push(k[j]);
        out.push(keys);
      }
      return out;
    }
    function origin() { return location.origin || (location.protocol + '//' + location.host); }
    function has(list, name) { var i; for (i = 0; i < (list || []).length; i++) if (list[i] === name) return true; return false; }

    var id = param('id');
    var items = parseList(param('list'));
    var idx = Math.max(0, Math.min(items.length - 1, parseInt(param('i'), 10) || 0));
    var nocc = {};         // ключи с русским звуком
    var hold = param('hold') === '1';
    var kidx = 0;          // какой ключ пункта сейчас играет
    var vid = 0;           // номер загрузки: старые таймеры чужого ролика ничего не делают
    var dir = 1;           // куда шли по списку: после мёртвого пункта — дальше в ту же сторону
    var dead = {};         // пункты, у которых не сыграл ни один ключ
    var player = null, ready = false, done = false, ad = false;
    var capMode = '', capTimer = null, skipTimer = null, adTimer = null;
    var veilEl = document.getElementById('veil'), veilTimer = null, started = false;
    var capEl = document.getElementById('capv'), capVeilTimer = null;
    (function () { var a = param('nocc').split(','), i; for (i = 0; i < a.length; i++) if (KEY.test(a[i])) nocc[a[i]] = 1; })();

    function send(ev, data) {
      var msg = { nf: id, ev: ev }, k;
      if (data) for (k in data) if (data.hasOwnProperty(k)) msg[k] = data[k];
      try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) {}
    }
    function key() { return (items[idx] || [])[kidx] || ''; }

    // Покрывало: full — чёрный кадр, on — закрыты кнопки YouTube, '' — снято. Реклама и пауза — без покрывала:
    // рекламу и то, что YouTube показывает на паузе (логотип, «Другие видео»), не закрываем.
    function veil(mode) {
      clearTimeout(veilTimer); veilTimer = null;
      if (!veilEl) return;
      veilEl.className = mode === 'full' ? 'on full' : mode ? 'on' : '';
      if (mode === 'full') veilTimer = setTimeout(function () { veil(''); }, VEIL_FULL);
      else if (mode === 'play') veilTimer = setTimeout(function () { veil(''); }, VEIL_HOLD);
    }
    // По состоянию плеера: до первой игры ролика — full; буфер — on; игра — on ещё VEIL_HOLD; пауза — снять.
    function veilState(s) {
      if (ad) veil('');
      else if (s === 1) { if (!started) capVeil(VEIL_CAP); started = true; veil('play'); }
      else if (!started) veil('full');
      else if (s === 3) veil('on');
      else if (s === 2) veil('');
    }
    // Перемотка: YouTube показывает кнопки и без смены состояния.
    function veilSeek() { if (started && !ad) veil('play'); }
    // Полоса над уведомлением YouTube о субтитрах: на ms (0 — снять). В рекламе — нет.
    function capVeil(ms) {
      clearTimeout(capVeilTimer); capVeilTimer = null;
      if (!capEl) return;
      capEl.className = ms && !ad ? 'on' : '';
      if (ms && !ad) capVeilTimer = setTimeout(function () { capVeil(0); }, ms);
    }

    // Новый ролик: пункт idx, ключ kidx. С hold — только загрузка, игра по команде play.
    function load() {
      var k = key();
      vid++; capMode = '';
      clearTimeout(capTimer); capTimer = null;
      clearTimeout(skipTimer); skipTimer = null;
      ad = false;            // плагин сбрасывает рекламу сам по item
      started = false; veil('full'); capVeil(0);
      if (!k) { fail(0); return; }
      send('item', { i: idx, key: k });
      try { if (hold) player.cueVideoById(k); else player.loadVideoById(k); } catch (e) { fail(-1); }
    }
    function go(i) {
      if (done) return;
      clearTimeout(skipTimer); skipTimer = null;
      if (i >= items.length) { finish(); return; }
      if (i < 0) { try { player.seekTo(0, true); veilSeek(); } catch (e) {} return; }   // «назад» с первого живого пункта — с начала
      idx = i; kidx = 0;
      load();
    }
    // Соседний живой пункт в сторону d (+1 или −1); за краем — −1 или items.length.
    function step(from, d) {
      var i = from + d;
      while (i >= 0 && i < items.length && dead[i]) i += d;
      return i;
    }
    function finish() {
      done = true; vid++;
      clearTimeout(capTimer); clearTimeout(skipTimer); clearInterval(adTimer);
      try { player.stopVideo(); } catch (e) {}
      send('end');
    }
    // Ошибка ролика (коды 2, 5, 100, 101, 150; 153 не проверен): следующий ключ пункта. Ключей нет —
    // error fatal, через 1,5 с соседний живой пункт в ту же сторону, куда шёл зритель, а после последнего — end.
    function fail(code) {
      var my, k = key(), next;
      if (kidx + 1 < (items[idx] || []).length) {
        send('error', { i: idx, key: k, code: code, fatal: false });
        kidx++;
        load();
        return;
      }
      if (dead[idx]) return;   // повтор той же ошибки: переход уже назначен
      dead[idx] = true;
      send('error', { i: idx, key: k, code: code, fatal: true });
      next = step(idx, dir);
      if (next < 0) { dir = 1; next = step(idx, 1); }   // назад живых нет — вперёд
      my = vid;
      skipTimer = setTimeout(function () { if (my === vid) go(next); }, NEXT_AFTER_FATAL);
    }

    // Реклама YouTube перед роликом: состояние −1, а время идёт, и в getOptions() есть модуль ad (замер 12.11.2026).
    // Модуль ad остаётся в списке и после рекламы, поэтому одного его мало. Пока реклама идёт, клавиши YouTube
    // не слушает, а дорожки субтитров — рекламные.
    function setAd(on) {
      if (on === ad) return;
      ad = on;
      send('ad', { on: on });
      try { veilState(player.getPlayerState()); } catch (e) {}
      if (!on && player && ready && !done) { capMode = ''; checkCaptions(CAP_WAIT); }
    }
    function pollAd() {
      if (!player || !ready || done) return;
      try { setAd(player.getPlayerState() === -1 && (player.getCurrentTime() || 0) > 0.3 && has(player.getOptions(), 'ad')); } catch (e) {}
    }

    // Русские субтитры — попытка, не проверено (§8.4). getOption('captions', 'tracklist') и
    // setOption('captions', 'track', …) в документации IFrame API не описаны: не сработают — ничего не сломается.
    // Режим: ru — есть русская дорожка; auto — попросили автоперевод другой дорожки на русский;
    // none — дорожек нет; unknown — плеер не дал прочитать список.
    function captions(my, tries) {
      var list = [], i, ru = null, mode;
      capTimer = null;
      if (my !== vid || !player || done) return;
      // Реклама: её дорожки не в счёт — проверка после неё.
      pollAd();
      if (ad) { capTimer = setTimeout(function () { captions(my, tries); }, 1000); return; }
      try {
        if (has(player.getOptions(), 'captions')) list = player.getOption('captions', 'tracklist');
        if (Object.prototype.toString.call(list) !== '[object Array]') list = [];
      } catch (e) {
        report('unknown');
        return;
      }
      // Модуль субтитров грузится не сразу: пустой список проверяем ещё несколько раз.
      if (!list.length && tries < CAP_TRIES) {
        capTimer = setTimeout(function () { captions(my, tries + 1); }, 1000);
        return;
      }
      for (i = 0; i < list.length; i++) {
        if (String(list[i].languageCode || '').toLowerCase().indexOf('ru') === 0) { ru = list[i]; break; }
      }
      if (ru) {
        // cc_lang_pref=ru, скорее всего, уже включил её; выбор дорожки — на случай, если нет.
        mode = 'ru';
        try { player.setOption('captions', 'track', { languageCode: ru.languageCode }); capVeil(VEIL_CAP); } catch (e) {}
      } else if (list.length) {
        try {
          // Без имени языка YouTube пишет в уведомлении «… >> undefined».
          player.setOption('captions', 'track', { languageCode: source(list).languageCode, translationLanguage: { languageCode: 'ru', languageName: 'Русский' } });
          capVeil(VEIL_CAP);
          mode = 'auto';
        } catch (e) { mode = 'none'; }
      } else mode = 'none';
      report(mode);
    }
    function report(mode) { capMode = mode; send('captions', { mode: mode }); }
    // Дорожка для автоперевода: ручная лучше автоматической (asr), английская лучше прочих.
    function source(list) {
      var best = list[0], bs = -1, i, t, s;
      for (i = 0; i < list.length; i++) {
        t = list[i];
        s = (t.kind === 'asr' ? 0 : 2) + (String(t.languageCode || '').toLowerCase().indexOf('en') === 0 ? 1 : 0);
        if (s > bs) { bs = s; best = t; }
      }
      return best;
    }
    // Проверка один раз на ролик; модуль субтитров, загруженный позже ответа none, — повод проверить снова.
    function checkCaptions(delay, late) {
      var my = vid;
      if (done) return;
      if (nocc[key()]) { noCaptions(); return; }
      if (capMode && !(late && capMode === 'none')) return;
      clearTimeout(capTimer);
      capTimer = setTimeout(function () { captions(my, 0); }, delay);
    }

    // Русский звук: субтитры не навязываются (cc_load_policy=1 включил бы их сам) и вердикта нет.
    function noCaptions() {
      try { if (player && has(player.getOptions(), 'captions')) player.unloadModule('captions'); } catch (e) {}
    }

    function destroy() {
      done = true; vid++;
      clearTimeout(capTimer); clearTimeout(skipTimer); clearInterval(adTimer);
      try { if (player) player.destroy(); } catch (e) {}
      player = null; ready = false;
    }

    window.addEventListener('message', function (e) {
      var d = e && e.data, s;
      if (!d || typeof d !== 'object' || d.nf !== id || !d.cmd) return;
      if (d.cmd === 'destroy') { destroy(); return; }
      if (!player || !ready || done) return;
      try {
        if (d.cmd === 'toggle') {
          s = player.getPlayerState();
          if (s === 1 || s === 3) player.pauseVideo(); else player.playVideo();
        }
        else if (d.cmd === 'play') { if (!started && !ad) veil('full'); player.playVideo(); }
        else if (d.cmd === 'pause') player.pauseVideo();
        else if (d.cmd === 'next') { dir = 1; go(step(idx, 1)); }
        else if (d.cmd === 'prev') { dir = -1; go(step(idx, -1)); }
        // Запасной ключ пункта без ошибки (реклама на русском ролике — английский).
        else if (d.cmd === 'alt') { if (kidx + 1 < (items[idx] || []).length) { kidx++; load(); } }
        else if (d.cmd === 'seek' && !ad) seek(+d.by || 0);
      } catch (ex) {}
    });

    // ±10 с. За концом ролика — конец пункта, как state 0: без этого YouTube начинал тот же ролик с нуля.
    function seek(by) {
      var t = (player.getCurrentTime() || 0) + by, d = player.getDuration() || 0;
      if (by > 0 && d > 0 && t >= d - 1) { go(step(idx, 1)); return; }
      player.seekTo(Math.max(0, t), true);
      veilSeek();
    }

    window.onYouTubeIframeAPIReady = function () {
      var first = key();
      if (done) return;
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        videoId: first,
        playerVars: {
          autoplay: hold ? 0 : 1, controls: 0, disablekb: 1, cc_load_policy: 1, cc_lang_pref: 'ru', hl: 'ru', rel: 0, playsinline: 1,
          modestbranding: 1, iv_load_policy: 3, fs: 0, enablejsapi: 1, origin: origin()
        },
        events: {
          onReady: function () {
            if (done) return;
            ready = true;
            send('ready');
            adTimer = setInterval(pollAd, AD_POLL);
            if (first) send('item', { i: idx, key: first });
            else fail(0);
          },
          onStateChange: function (e) {
            var s = e ? e.data : -1;
            if (done) return;
            if (s === 1) pollAd();
            veilState(s);
            send('state', { s: s });
            if (s === 1) checkCaptions(CAP_WAIT);
            else if (s === 0) { dir = 1; go(step(idx, 1)); }     // конец ролика — следующий пункт
          },
          onError: function (e) { if (!done) fail(e ? e.data : -1); },
          // Модуль субтитров или рекламы загрузился (или сменился): проверить сразу.
          onApiChange: function () { pollAd(); checkCaptions(0, true); }
        }
      });
    };

    veil('full');
    send('bridge');
  })();
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
